name: Refresh primary-source index
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: NSE ticker (any valid symbol)
        required: true
        default: INFY
      source_url:
        description: Optional original issuer or exchange PDF URL
        required: false
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Index documents
        env:
          TICKER: ${{ inputs.ticker }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            python scripts/ingest.py --ticker "$TICKER" --url "$SOURCE_URL"
          else
            python scripts/ingest.py --ticker "$TICKER"
          fi
      - name: Save index
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add public/data/seed.json
          git diff --cached --quiet || git commit -m 'Refresh primary-source index'
          git push
